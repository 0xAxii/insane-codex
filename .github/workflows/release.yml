name: Release binaries

on:
  push:
    tags:
      - "v*-insane.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      UPSTREAM_TAG: rust-v0.172.0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "none"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Fetch and patch Codex
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/openai/codex.git upstream
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/no-client-guardrails.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patches/no-client-guardrails.patch"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: upstream/codex-rs -> target
          key: ${{ matrix.target }}

      - name: Build Codex
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo build --locked --release --bin codex --bin codex-code-mode-host --bin codex-exec-server
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo build --locked --release --bin bwrap
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --locked --release --bin codex-command-runner --bin codex-windows-sandbox-setup
          fi

      - name: Assemble complete Codex package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/upstream"
          suffix=""
          extra=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            suffix=".exe"
            extra+=(--codex-command-runner-bin "upstream/codex-rs/target/release/codex-command-runner.exe")
            extra+=(--codex-windows-sandbox-setup-bin "upstream/codex-rs/target/release/codex-windows-sandbox-setup.exe")
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            extra+=(--bwrap-bin "upstream/codex-rs/target/release/bwrap")
          fi
          python3 upstream/scripts/build_codex_package.py \
            --target "$TARGET" --cargo-profile release --strip none \
            --package-dir "$GITHUB_WORKSPACE/package" \
            --entrypoint-bin "upstream/codex-rs/target/release/codex${suffix}" \
            --code-mode-host-bin "upstream/codex-rs/target/release/codex-code-mode-host${suffix}" \
            --exec-server-bin "upstream/codex-rs/target/release/codex-exec-server${suffix}" \
            "${extra[@]}"
          mv "package/bin/codex${suffix}" "package/bin/insane-codex${suffix}"
          python3 -c 'import json, pathlib, sys; p = pathlib.Path("package/codex-package.json"); data = json.loads(p.read_text()); data["entrypoint"] = "bin/insane-codex" + sys.argv[1]; p.write_text(json.dumps(data, indent=2) + "\n")' "$suffix"
          test -x "package/bin/insane-codex${suffix}"
          test -x "package/bin/codex-code-mode-host${suffix}"
          test -x "package/bin/codex-exec-server${suffix}"
          "package/bin/insane-codex${suffix}" --version
          "package/bin/codex-code-mode-host${suffix}" --help

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="insane-codex-${TARGET}.tar.gz"
          mkdir -p release
          tar -C package -czf "release/${asset}" .

      - name: Verify glibc 2.35 compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for binary in package/bin/* package/codex-resources/bwrap; do
            max_glibc="$(
              readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
              | sed 's/^GLIBC_//' \
              | sort -Vu \
              | tail -n 1 || true
            )"
            if [[ -n "$max_glibc" ]]; then
              dpkg --compare-versions "$max_glibc" le "2.35"
              echo "$binary maximum required glibc version: $max_glibc"
            fi
          done

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "insane-codex-$env:TARGET.zip"
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "package/*" -DestinationPath "release/$asset"

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Patched OpenAI Codex CLI 0.172.0 binaries.

          The binaries are built from `rust-v0.172.0` after applying
          `patches/no-client-guardrails.patch`. See the repository README and
          patch details before installing.

          Guardian and Daybreak client paths are disabled. The binary defaults
          to YOLO-equivalent permissions unless an explicit permission mode is
          selected, and interactive sessions use the patched embedded app
          server unless an explicit remote endpoint is selected. Linux binaries
          support glibc 2.35. Runtime permission updates, managed network review,
          and safety recourse otherwise retain the upstream Codex behavior.
          Each archive includes the Code Mode host, execution server, search
          binary, package metadata, and platform-specific runtime helpers.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            release/*.tar.gz \
            release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "insane-codex $GITHUB_REF_NAME" \
            --notes-file release-notes.md
